<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#1f1f1f">
    <title>Offline</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font-family: ui-sans-serif, system-ui, sans-serif;
            background: #1f1f1f;
            color: #f5f5f5;
        }

        main {
            width: min(100%, 24rem);
            text-align: center;
        }

        img {
            width: 5rem;
            height: 5rem;
            margin: 0 auto 1.5rem;
            border-radius: 1rem;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: 1.5rem;
            font-weight: 600;
        }

        p {
            margin: 0 0 1.5rem;
            line-height: 1.5;
            color: #a3a3a3;
        }

        #retry-status {
            min-height: 1.25rem;
            margin: 0 0 1rem;
            font-size: 0.875rem;
            color: #fbbf24;
        }

        button {
            border: 0;
            border-radius: 9999px;
            padding: 0.75rem 1.25rem;
            font: inherit;
            font-weight: 600;
            color: #171717;
            background: #f5f5f5;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <main>
        <img src="/pwa-icon-512.png" alt="" width="80" height="80">
        <h1>You are offline</h1>
        <p>Live temperatures need a network connection. Finished cook pages you have opened before may still be available offline.</p>
        <p id="retry-status" aria-live="polite"></p>
        <button id="retry-button" type="button">Try again</button>
    </main>
    <script>
        (function () {
            const button = document.getElementById('retry-button');
            const status = document.getElementById('retry-status');

            function setStatus(message) {
                status.textContent = message;
            }

            async function isOnline() {
                try {
                    const response = await fetch('/live/cook-status', {
                        cache: 'no-store',
                        credentials: 'same-origin',
                        headers: { Accept: 'application/json' },
                    });

                    return response.ok;
                } catch {
                    return false;
                }
            }

            async function retryConnection() {
                button.disabled = true;
                setStatus('Checking connection…');

                if (! await isOnline()) {
                    button.disabled = false;
                    setStatus('Still offline. Check your connection and try again.');

                    return;
                }

                const target = new URL(window.location.pathname || '/', window.location.origin);
                target.searchParams.set('_retry', String(Date.now()));

                window.location.replace(target.href);
            }

            button.addEventListener('click', retryConnection);

            window.addEventListener('online', () => {
                setStatus('Connection restored. Tap try again.');
            });
        })();
    </script>
</body>
</html>
