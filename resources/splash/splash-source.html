<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #12081c;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3.5vmin;
      text-align: center;
      padding: 8vmin;
    }
    .splash img {
      width: 36vmin;
      height: 36vmin;
      object-fit: contain;
    }
    .splash p {
      margin: 0;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 6vmin;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div class="splash">
    <img src="../../public/pwa-icon-512.png" alt="">
    <p>Alex.bbq</p>
  </div>
</body>
</html>
